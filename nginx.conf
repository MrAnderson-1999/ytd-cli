server {
    listen 80;
    server_name _;

    # Serve the SPA, falling back to index.html
    location / {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;  # SPA routing :contentReference[oaicite:1]{index=1}
    }

    # Proxy API requests to the Flask backend
    location /download {
        proxy_pass         http://backend:5000/download;  # service name on default network :contentReference[oaicite:2]{index=2}
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
    }
}
