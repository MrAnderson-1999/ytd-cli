server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 1) SPA “try_files” for client-side routing
    location / {
        try_files $uri $uri/ /index.html;      # deep-links served by React Router :contentReference[oaicite:7]{index=7}
    }

    # 2) Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public";
    }

    # 3) Proxy download requests to backend
    location /download {
        proxy_pass          http://backend:5000/download;
        proxy_http_version 1.1;
        proxy_set_header    Host               $host;
        proxy_set_header    X-Real-IP          $remote_addr;
        proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_connect_timeout 300s;             # match backend long-running streams 
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        send_timeout          300s;
    }

    location /api/info {
        proxy_pass          http://backend:5000/info;
        proxy_http_version 1.1;
        proxy_set_header    Host               $host;
        proxy_set_header    X-Real-IP          $remote_addr;
        proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_connect_timeout 300s;             # match backend long-running streams 
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        send_timeout          300s;
    }

    # 4) (Optional) Proxy all other API calls
    location /api/ {
        proxy_pass http://backend:5000/api/;
    }
}
