services:
  backend:
    container_name: yt-backend    # Explicit container name
    image: yt-backend:latest      # Use the locally built image
    ports:                        # Correctly map host→container port
      - "5000:5000"
    restart: unless-stopped       # Self-healing policy

  frontend:
    container_name: yt-frontend
    image: yt-frontend:latest
    ports:
      - "80:80"
    restart: unless-stopped

networks:
  default:
    name: ytd-network             # Dedicated network for service discovery
