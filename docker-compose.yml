services:
  backend:
    build:
      context: backend/
      dockerfile: backend/Dockerfile
    image: yt-backend:latest
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: frontend/
      dockerfile: frontend/Dockerfile
    image: yt-frontend:latest
    ports:
      - "80:80"
    restart: unless-stopped

networks:
  default:
    name: ytd-network
