services:
  backend:
    build:
      context: ./backend             # your existing backend folder :contentReference[oaicite:1]{index=1}
      dockerfile: Dockerfile
    image: yt-backend:latest         # tags the built image locally
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend            # your existing frontend folder :contentReference[oaicite:2]{index=2}
      dockerfile: Dockerfile
    image: yt-frontend:latest
    ports:
      - "80:80"
    restart: unless-stopped

networks:
  default:
    name: ytd-network
