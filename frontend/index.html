<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YTDL WAV/Playlist Downloader</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 1rem; }
    input { width: 100%; padding: 0.5rem; margin-bottom: 1rem; }
    button { padding: 0.5rem 1rem; font-size: 1rem; }
  </style>
</head>
<body>
  <h1>Download YouTube Audio or Playlist</h1>
  <input id="yturl" type="text" placeholder="Enter YouTube URL or playlist link" />
  <button id="download">Download</button>

  <script>
    document.getElementById('download').addEventListener('click', async () => {
      const url = document.getElementById('yturl').value.trim();
      if (!url) {
        alert('Please enter a valid YouTube URL or playlist.');
        return;
      }

      try {
        const apiUrl = `${window.location.protocol}//${window.location.hostname}:5000/download`;
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });

        if (!response.ok) {
          throw new Error(await response.text() || response.statusText);
        }

        // Ensure Content-Disposition is readable by JS
        // (server must send Access-Control-Expose-Headers: Content-Disposition)
        const dispo = response.headers.get('Content-Disposition') || '';

        // Attempt to extract UTF-8 filename* per RFC5987
        let filename;
        const rfc5987 = dispo.match(/filename\*\=UTF-8''([^;]+)/);
        if (rfc5987) {
          filename = decodeURIComponent(rfc5987[1]);
        } else {
          // Fallback to ASCII filename="..."
          const regular = dispo.match(/filename=\"?([^\";]+)\"?/);
          filename = regular ? regular[1] : 'download';
        }

        // Read streamed response as Blob
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);

        // Create a link with the correct filename and trigger download
        const link = document.createElement('a');
        link.href = blobUrl;
        link.download = filename;
        document.body.appendChild(link);   // required for Firefox
        link.click();

        // Cleanup
        link.remove();
        URL.revokeObjectURL(blobUrl);
      } catch (err) {
        alert('Download failed: ' + err.message);
      }
    });
  </script>
</body>
</html>
