<script>
  document.getElementById('download').onclick = async () => {
    const ytUrl = document.getElementById('yturl').value.trim();
    if (!ytUrl) {
      alert('Enter a YouTube URL first.');
      return;
    }

    try {
      // 1) Request stream from backend
      const resp = await fetch(`http://${window.location.hostname}:5000/download`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: ytUrl })
      });
      if (!resp.ok) {
        throw new Error(await resp.text());
      }

      // 2) Convert to Blob
      const blob = await resp.blob();

      // 3) Create URL & trigger download
      const urlObject = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = urlObject;
      link.download = 'audio.wav';
      document.body.appendChild(link); // needed for Firefox
      link.click();

      // 4) Cleanup
      link.remove();
      URL.revokeObjectURL(urlObject);
    } catch (err) {
      alert('Download failed: ' + err.message);
    }
  };
</script>
